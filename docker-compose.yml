name: foodstore

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodstore
      POSTGRES_USER: foodstore
      POSTGRES_PASSWORD: foodstore
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodstore -d foodstore"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: